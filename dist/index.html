  camFocus.lerp(new THREE.Vector3(mx,0.6+(a.y+b.y)/2,mz),1-Math.pow(0.001,dt));
  const target=camFocus.clone().add(CAM_DIR.clone().multiplyScalar(dist));
  camPos.lerp(target,1-Math.pow(0.002,dt)); camera.position.copy(camPos); camera.lookAt(camFocus);
  camYaw=Math.atan2(CAM_DIR.x,CAM_DIR.z); // screen-forward maps to world direction (-dir.x,-dir.z)
  sun.target.position.copy(camFocus); sun.position.copy(camFocus).add(sunDir.clone().multiplyScalar(40));
}
const sunDir=new THREE.Vector3(0.5,1,0.35);

/* ===================== HOTSPOTS ===================== */
function flatKitchenPos(){ const it=S.home.items.find(i=>i.type==='kitchen')||S.home.items.find(i=>i.type==='stove'); if(it){ const d=ITEMS[it.type]; const [x,z]=cellToWorld(it.x,it.y); return [x+(d.w-1)*FLAT.cell/2,z+0.8]; } return [-3.2,2.9]; }
function bedPos(){ const it=S.home.items.find(i=>i.type==='bed'||i.type==='mattress'); if(it){ const [x,z]=cellToWorld(it.x,it.y); return [x+FLAT.cell/2,z+0.8]; } return [-7,2.6]; }
function nearest(i){
  const p=players[i].g.position; const list=[]; const d=(x,z)=>Math.hypot(p.x-x,p.z-z);
  if(ghosts[i]) return {id:'place',label:ghosts[i].ok?`Place the ${ITEMS[ghosts[i].type].name.toLowerCase()} here`:'Does not fit here',dist:0};
  for(const h of HOTSPOT_HOOKS){ const r=h(i,list,d); if(r) return r; }
  if(sofa&&sofa.g.visible&&S.sofa.state!=='placed'){ if(sofa.carrying&&sofa.holder.includes(i)) list.push({id:'drop',label:'Set the sofa down',dist:0.5}); else { const e0=sofaEnd(0), e1=sofaEnd(1); const dd=Math.min(d(e0[0],e0[1]),d(e1[0],e1[1])); if(dd<1.3) list.push({id:'sofa',label:sofa.holder&&(sofa.holder[0]===i||sofa.holder[1]===i)?'Holding the sofa':'Grab the sofa',dist:dd}); } }
  for(const st of STALLS){ const dir=st.z<0?1:-1; const dd=d(st.x,st.z+dir*1.1); if(dd<1.9) list.push({id:'stall:'+st.id,label:(S.time>=19&&!st.shop)||(S.time>=21)?`${st.name} (closed)`:`Buy from ${st.name}`,dist:dd}); }
  { const dd=d(26.4,0); if(dd<1.8) list.push({id:'popup',label:S.dishes.length?'Set up a pop-up stall':'Pop-up spot (bring a dish)',dist:dd}); }
  [['ws:ada',-6,-15.2,'Ada\u2019s bench'],['ws:tunde',6,-15.2,'the garden corner'],['ws:bassey',-6,-19.3,'the photo corner'],['ws:kitchen',6,-19.3,'the community kitchen']].forEach(([id,x,z,nm])=>{ const dd=d(x,z); if(dd<1.9) list.push({id,label:(S.time<8||S.time>=18)?`${nm} (closed)`:`Join ${nm}`,dist:dd}); });
  { const dd=d(12.4,14.2); if(dd<1.9) list.push({id:'fish',label:'Fish off the rocks',dist:dd}); }
  { const dd=d(3,12.5); if(dd<1.6) list.push({id:'photospot',label:'Sit, watch the water, take a photo',dist:dd}); }
  { const dd=d(0,-5.5); if(dd<1.8) list.push({id:'board',label:'Read the noticeboard',dist:dd}); }
  { const [kx,kz]=flatKitchenPos(); const dd=d(kx,kz); if(dd<1.7) list.push({id:'cook',label:'Cook',dist:dd}); }
  { const [bx,bz]=bedPos(); const dd=d(bx,bz); if(dd<1.6) list.push({id:'sleep',label:S.dishes.length?'Eat something, or sleep':'Sleep',dist:dd}); }
  for(const k in npcs){ const n=npcs[k]; if(!n.g.visible) continue; const dd=d(n.g.position.x,n.g.position.z); if(dd<1.8) list.push({id:'talk:'+k,label:`Talk to ${CAST[k].name}`,dist:dd-0.4}); }
  list.sort((a,b)=>a.dist-b.dist); return list[0]||null;
}

/* ===================== ENTER WORLD ===================== */
function enterWorld(){ S.wardrobe=S.wardrobe||[]; S.garden=S.garden||{}; S.square=S.square||0; rebuildSquare(); applyBigText(); S.weather=S.weather||{day:S.day}; if(S.roof&&S.roof.on){ S.roof=null; if(S.party&&S.party.on&&!S.party.done&&!S.party.round){ S.party.indoor=true; S.party.dry=[]; S.party.wet=['chairs','speaker','lights','cooler']; } } rebuildGarden(); spawnPlayers(); spawnNPCs(); rebuildFurniture(); refreshHomeExtras(); if(sofa){ scene.remove(sofa.g); sofa=null; } if(crate){ scene.remove(crate); } if(ball){ scene.remove(ball); } buildProps(); ensureMarket(); updateHUD(); save(); }
function ensureMarket(){ if(!S.mkt||S.mkt.day!==S.day){ const q=()=>rnd(['good','good','okay','okay','soft']); const items={}; for(const k in ING){ items[k]={price:Math.round(ING[k].price*(0.9+R()*0.25)/50)*50,qual:QUALNOTE[k]?q():null}; } if(S.day===1) items.tomato.qual='soft'; S.mkt={day:S.day,items,disc:{}}; } }

/* ===================== HOTSPOT ACTIONS ===================== */
ACTIONS.hs=d=>doAct(+d.i,{id:d.id,label:''});
function doAct(i,hs){
  const id=hs.id; const [kind,arg]=id.split(':');
  for(const h of ACT_HOOKS){ if(h(i,kind,arg,hs)) return; }
  if(kind==='place'){ placeGhost(i); return; }
  if(kind==='sofa'){ grabSofa(i); return; }
  if(kind==='drop'){ releaseSofa(); return; }
  if(kind==='stall'){ openStall(i,STALLS.find(s=>s.id===arg)); return; }
  if(kind==='popup'){ openPopup(i); return; }
  if(kind==='ws'){ openWorkshop(i,arg); return; }
  if(kind==='fish'){ doFish(i); return; }
  if(kind==='photospot'){ doPhotoSpot(i); return; }
  if(kind==='board'){ openBoard(); return; }
  if(kind==='cook'){ openCookPick(); return; }
  if(kind==='sleep'){ openSleep(); return; }
  if(kind==='talk'){ openTalk(i,arg); return; }
}
/* --- market --- */

  const disc=S.mkt.disc[st.id]||0; const hk=S.day+st.id; const haggled=!!S.haggled[hk];
  const rows=st.items.map(k=>{ const it=S.mkt.items[k]; const price=Math.round(it.price*(1-disc)/50)*50; const note=it.qual?QUALNOTE[k][it.qual]:ING[k].fabric?{ankara:'Wax print, six yards. Loud in the best way.',adire:'Hand-dyed indigo from Abeokuta. No two yards agree.',asooke:'Woven, heavy, for occasions that matter.',lace:'Cream with a sheen. Sunday, properly.'}[k]:(k==='rice'?'Bundle: rice and any oil together, \u20a6500 back.':k==='drinks'?'For a gathering you will want this.':k==='flour'?'Puff-puff flour, if you know how.':''); return `<div class="card" style="margin:6px 0;padding:8px 10px"><b>${esc(ING[k].name)}</b> <span class="small">${naira(price)}</span>${it.qual?` <span class="tiny">${it.qual}</span>`:''}<div class="tiny">${esc(note)}</div><div class="row">${btn('Buy one','buy',{i,k,st:st.id,price},'',`you have ${haveCount(k)}`)}</div></div>`; }).join('');
  openPanel(`<h2>${esc(st.name)}</h2><p class="muted small">${pchip(i)} is at the stall. Household purse: ${naira(S.money)}.</p>${S.tmpLine?`<div class="hint">${S.tmpLine}</div>`:''}${rows}<div class="row">${haggled?'':btn('Ask for last price','haggle',{i,st:st.id},'quiet')}${btn('Done','closeMarket',{},'primary')}</div>`);
}

function updateBall(dt){ if(!ball) return; if(NET.on&&!NET.isHost) return; for(const p of players){ const dx=ball.position.x-p.g.position.x, dz=ball.position.z-p.g.position.z; const d=Math.hypot(dx,dz); if(d<PR+0.3&&d>0.001){ const k=p.moving?5.2:2.5; ball.v=[dx/d*k,dz/d*k]; } } let [vx,vz]=ball.v; if(Math.abs(vx)+Math.abs(vz)<0.01){ ball.v=[0,0]; return; } let nx=ball.position.x+vx*dt, nz=ball.position.z+vz*dt; if(blocked(nx,ball.position.z,0.26,{noCrate:false})){ vx=-vx*0.6; nx=ball.position.x; } if(blocked(nx,nz,0.26)){ vz=-vz*0.6; nz=ball.position.z; } ball.position.x=nx; ball.position.z=nz; ball.rotation.x+=vz*dt*3.8; ball.rotation.z-=vx*dt*3.8; const f=Math.max(0,1-1.6*dt); ball.v=[vx*f,vz*f]; }

function scheduleWeather(){ S.weather={day:S.day}; if(S.day>=2&&season(S.day)==='rains'&&chance(0.35)){ const a=13+R()*3; S.weather.rainAt=a; S.weather.rainTo=a+1.2; } }

}

/* ===================== NEIGHBOR ROUTINES (walking the roads) ===================== */
const NAV=[[4,10.2],[0,0],[4,4.6],[-12.75,10.2],[12.75,10.2],[12.75,-11.75],[-12.75,-11.75],[0,-11.75],[0,-16.5],[21,0],[0,12.5],[-22,0],[-1.7,-4.9],[24,2],[-1.75,0.8],[-1.75,4.9],[-5.3,4.9],[10.2,0.5],[7.3,5.5],[6.7,10.2]];
const NAVE=[[0,2],[2,1],[1,12],[0,3],[0,4],[4,5],[5,7],[7,8],[3,6],[6,7],[4,9],[9,13],[0,10],[3,11],[1,14],[14,15],[15,16],[17,18],[18,19],[19,0]];
const NAVADJ=NAV.map(()=>[]); NAVE.forEach(([a,b])=>{ NAVADJ[a].push(b); NAVADJ[b].push(a); });
function nearestNode(x,z){ let best=0,bd=1e9; NAV.forEach((n,i)=>{ const d=Math.hypot(n[0]-x,n[1]-z); if(d<bd){ bd=d; best=i; } }); return best; }
function navPath(a,b){ if(a===b) return [a]; const prev={}; prev[a]=null; const q=[a]; while(q.length){ const u=q.shift(); for(const v of NAVADJ[u]){ if(prev[v]===undefined){ prev[v]=u; if(v===b){ const path=[b]; let c=b; while(prev[c]!==null){ c=prev[c]; path.unshift(c); } return path; } q.push(v); } } } return [a,b]; }
function walkNPC(n,spot,hideAtEnd){ const from=nearestNode(n.g.position.x,n.g.position.z); const to=spot?nearestNode(spot[0],spot[1]):12; const path=navPath(from,to).map(i=>NAV[i]); if(spot) path.push([spot[0],spot[1]]); n.route=path; n.ri=0; n.hideAtEnd=!!hideAtEnd; n.dest=spot; if(!n.g.visible&&!hideAtEnd){ n.g.visible=true; n.g.position.set(NAV[12][0],0,NAV[12][1]); } }
function updateNPCWalk(dt){ for(const k in npcs){ const n=npcs[k]; if(!n.route) continue; const tgt=n.route[n.ri]; const dx=tgt[0]-n.g.position.x, dz=tgt[1]-n.g.position.z; const d=Math.hypot(dx,dz); if(d<0.25){ n.ri++; if(n.ri>=n.route.length){ n.route=null; if(n.hideAtEnd) n.g.visible=false; else if(n.dest){ n.g.position.set(n.dest[0],0,n.dest[1]); n.g.rotation.y=n.dest[2]||0; n.home=n.dest; } } continue; } const sp=1.7; n.g.position.x+=dx/d*sp*dt; n.g.position.z+=dz/d*sp*dt; n.g.rotation.y=Math.atan2(dx,dz); n.t+=dt; animAvatar(n.g,n.t,true,false,sp,dt); } }
function reroute(){ const sl=slot(); for(const k in npcs){ const n=npcs[k]; const spot=(S.party&&S.party.on&&S.party.guests.includes(k))?(S.party.indoor?partySpotIn(k):partySpot(k)):NPC_SPOTS[k][sl]; if(!spot){ if(n.g.visible) walkNPC(n,null,true); continue; } if(n.home&&n.home[0]===spot[0]&&n.home[1]===spot[1]&&!n.route) continue; if(!n.g.visible&&!n.route){ n.g.visible=true; n.g.position.set(NAV[12][0],0,NAV[12][1]); } walkNPC(n,spot,false); } }
function arriveGuests(){ const pt=S.party; for(const k of pt.guests){ const n=npcs[k]; const spot=pt.indoor?partySpotIn(k):partySpot(k); n.g.visible=true; n.g.position.set(4+R()*2,0,9.5+R()); n.route=null; walkNPC(n,spot,false); } }

function updateCallouts(dt){ const now=performance.now(); for(const k in bubbles){ const b=bubbles[k]; if(b.visible&&now>b.until) b.visible=false; }

function shade(hex,f){ const n=parseInt(hex.slice(1),16); const r=Math.round(((n>>16)&255)*f), g=Math.round(((n>>8)&255)*f), b=Math.round((n&255)*f); return '#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join(''); }
function tint(hex,f){ const n=parseInt(hex.slice(1),16); const r=(n>>16)&255, g=(n>>8)&255, b=n&255; const m=v=>Math.round(v+(255-v)*f); return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join(''); }

/* ===================== LOOK: environment light for the character, better shadow bias, a soft rim light =====================
   Full quality: the character asset is drawn with physically based materials (per-part roughness: glossy eyes, matte cloth, a
   metallic band) lit by an image-based environment — a small procedural "room" of sky, horizon, ground and sun, pre-filtered
   once per half hour of game time. The world keeps its warm flat shading (a PBR pass over it was tried and looked washed out).
   The sun uses a normal bias instead of a large depth bias, and a faint cool rim light separates people from the ground. */
const LOOK={pbr:(()=>{ try{ if(/[?&]look=flat/.test(location.search)) return false; return localStorage.getItem('cd3-quality')!=='lite'; }catch(e){ return true; } })(),env:null,envKey:'',rim:null};
function makeEnv(rend,top,horizon,ground,sunC,sunV,sunSize){
  const pm=new THREE.PMREMGenerator(rend); const sc=new THREE.Scene(); const B=(c)=>new THREE.MeshBasicMaterial({color:c,side:THREE.BackSide});
  sc.add(new THREE.Mesh(new THREE.BoxGeometry(20,20,20),[B(horizon),B(horizon),B(top),B(ground),B(horizon),B(horizon)]));
  const sun=new THREE.Mesh(new THREE.PlaneGeometry(sunSize||3,sunSize||3),new THREE.MeshBasicMaterial({color:sunC})); sun.position.copy(sunV).normalize().multiplyScalar(9); sun.lookAt(0,0,0); sc.add(sun);
  const t=pm.fromScene(sc,0.03).texture; pm.dispose(); return t;
}
function updateEnv(){ if(!LOOK.pbr||!renderer||!scene) return; const h=S?S.time%24:10; const key=Math.floor(h*2)+':'+((S&&S.weather&&S.weather.raining)?'r':'d');
  if(key===LOOK.envKey) return; LOOK.envKey=key;
  const u=skyDome&&skyDome.material.uniforms; const top=u?u.top.value.clone():new THREE.Color('#5E9BD6'); const hor=u?u.horizon.value.clone():new THREE.Color('#E8D9C0');
  const night=(h>=19.5||h<5.5); const ground=new THREE.Color(night?'#2A2420':'#8C6B4A'); const sunC=new THREE.Color(night?'#3A3A60':'#FFF1D0');
  const old=LOOK.env; LOOK.env=makeEnv(renderer,top.multiplyScalar(night?0.5:0.9),hor.multiplyScalar(night?0.45:0.85),ground,sunC,sunDir,night?2:3.2); scene.environment=LOOK.env; if(old) old.dispose(); }
TICK_HOOKS.push(()=>{ updateEnv(); });

/* ===================== GROUNDING: contact shadows and ground variation =====================
   Walls and buildings get a soft contact shadow where they meet the ground (one merged multiply-blended mesh), and the open sand
   gets large, soft tonal variation so it stops reading as a flat fill. */
const FOL={tex:{},contacts:[]};
function folRand(seed){ let s=seed>>>0||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
/* contact shadows: a multiply-blended ring around the foot of every free-standing wall or building, merged into one mesh */
function noteContact(w,d,x,z){ FOL.contacts.push([w,d,x,z]); }
function buildContactShadows(){ if(!FOL.contacts.length) return; const pos=[],col=[],idx=[]; let base=0; const dark=0.5, margin=0.5;
  for(const [w,d,x,z] of FOL.contacts){ const a=w/2, b=d/2, A=a+margin, B=b+margin; const ring=[[-a,-b],[a,-b],[a,b],[-a,b],[-A,-B],[A,-B],[A,B],[-A,B]];
    ring.forEach(([px,pz],i)=>{ pos.push(x+px,0.024,z+pz); const c=i<4?dark:1; col.push(c,c,c); });
    const q=[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]]; q.forEach(([i0,i1,i2,i3])=>{ idx.push(base+i0,base+i2,base+i1, base+i0,base+i3,base+i2); }); base+=8; }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); geo.setIndex(idx);
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,blending:THREE.MultiplyBlending,transparent:true,depthWrite:false})); m.renderOrder=1; m.frustumCulled=false; scene.add(m); FOL.contactMesh=m; }
/* open ground: large soft tonal variation on the sand */
function buildGroundVariation(){ const S=512; const cv=document.createElement('canvas'); cv.width=cv.height=S; const g=cv.getContext('2d'); const R=folRand(4242); g.clearRect(0,0,S,S);
  for(let i=0;i<70;i++){ const x=R()*S, y=R()*S, r=18+R()*60; const dark=R()<0.55; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,dark?'rgba(120,80,40,.2)':'rgba(255,240,210,.16)'); gr.addColorStop(1,dark?'rgba(120,80,40,0)':'rgba(255,240,210,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); const m=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.set(0,-0.012,0); m.renderOrder=0; scene.add(m); }

/* ===================== THE COURTYARD DIORAMA (glTF environment asset) =====================
   assets/env/courtyard.gltf.json: a furnished veranda scene supplied as a modelled asset (cream plaster veranda with a
   corrugated roof, blue door and shutters, stone paving, woven armchair, low table with a meal, planters, string lights).
   It stands against the north block of Palm Court, facing the courtyard, as the compound's first modelled area.
   Its ten named roots carry source-object bounds in extras; those give the colliders and the raised-floor heights.
   The game's own sofa stays the carried one, so the asset's static sofa is hidden. If the file fails to load, the
   procedural north wall simply stays as it was. */
const DIORAMA={url:'assets/env/courtyard.gltf.json',off:new THREE.Vector3(0,0,-3.39),state:'idle',root:null,error:null,hide:['Teal sofa'],loadedMs:0};
/* raised floors of the diorama in world space (x1,x2,z1,z2,height) */
const DIORAMA_LEVELS=[[-3.5,3.5,-2.27-3.39,-0.87-3.39,0.15],[-2.67,0.38,-0.88-3.39,-0.5-3.39,0.07],[-2.43,-1.03,-3.1-3.39,-2.1-3.39,0.16]];
function dioramaLevel(x,z){ for(const [x1,x2,z1,z2,h] of DIORAMA_LEVELS){ if(x>=x1&&x<=x2&&z>=z1&&z<=z2) return h; } return 0; }
function dioramaLoad(){
  if(DIORAMA.state!=='idle'||typeof THREE.GLTFLoader!=='function') return; DIORAMA.state='loading'; const t0=performance.now();
  new THREE.GLTFLoader().load(DIORAMA.url,(g)=>{ try{
    const root=g.scene; root.position.copy(DIORAMA.off); root.name='courtyardDiorama';
    root.traverse(o=>{ if(!o.isMesh) return; o.castShadow=true; o.receiveShadow=true; const mats=Array.isArray(o.material)?o.material:[o.material]; mats.forEach(m=>{ if(m.isMeshStandardMaterial){ m.envMapIntensity=0.5; if(m.map){ m.map.anisotropy=4; } } }); });
    const norm=(n)=>String(n||'').replace(/[\s_]+/g,' ').trim(); // GLTFLoader turns spaces in node names into underscores
    for(const child of root.children){ if(DIORAMA.hide.map(norm).includes(norm(child.name))) child.visible=false; }
    scene.add(root); DIORAMA.root=root; DIORAMA.state='ready'; DIORAMA.loadedMs=Math.round(performance.now()-t0);
    dioramaColliders(root);
  }catch(e){ DIORAMA.state='error'; DIORAMA.error=e.message||String(e); console.warn('[Compound Days] courtyard asset rejected:',DIORAMA.error); } },
  undefined,(e)=>{ DIORAMA.state='error'; DIORAMA.error=(e&&(e.message||e.statusText))||'network error'; console.warn('[Compound Days] courtyard asset failed to load:',DIORAMA.error); });
}
/* colliders: props from their root bounds; the architecture from its named pieces (walls, columns, boundary wall, shelf) */
function dioramaColliders(root){
  const o=DIORAMA.off; const add=(mn,mx,tag,pad)=>{ pad=pad||0; addObs(o.x+mn[0]-pad,o.x+mx[0]+pad,o.z+mn[2]-pad,o.z+mx[2]+pad,tag); };
  root.updateMatrixWorld(true);
  for(const child of root.children){ const ex=child.userData||{};
    if(ex.category==='prop'&&child.visible){ const bb=new THREE.Box3().setFromObject(child); const shrink=/planter/i.test(child.name)?0.12:0.06; addObs(bb.min.x+shrink,bb.max.x-shrink,bb.min.z+shrink,bb.max.z-shrink,'diorama'); }
    const nm=String(child.name||'').replace(/[\s_]+/g,' ').trim();
    if(nm==='String lights') add([-3.26,0,1.36],[-3.1,0,1.5],'diorama');
    if(nm==='Courtyard architecture'){ for(const so of (ex.sourceObjects||[])){ const n=so.name; const [mn,mx]=so.localBounds;
      if(/Cream plaster wall|Door jamb|Veranda cream column|Compound boundary wall|Kitchen shelf support|Room back wall|Window frame/.test(n)) add(mn,mx,'diorama',n.includes('wall')?0.06:0.02); } }
  }
}
function dioramaStatusText(){ if(DIORAMA.state==='ready') return ` Courtyard asset: ${DIORAMA.url} (${DIORAMA.loadedMs} ms).`; if(DIORAMA.state==='error') return ` Courtyard asset could not be used (${esc(DIORAMA.error)}).`; return ''; }

/* ===================== CREATOR: headwear as its own category, thumbnails of the equipped model =====================
   Hair and Headwear are separate choices (a wrap goes over whatever hair is chosen). Each hair / outfit button carries a
   small render of the actual model wearing that option, drawn with a tiny offscreen renderer after the panel opens, one
   per frame so phones do not stall; they are redrawn (debounced) as the character asset and wardrobe pieces arrive.
   Old saves with hair 'wrap' read as low taper + everyday wrap. */
const HEADWEAR=[{id:'none',name:'None'},{id:'wrap',name:'Everyday wrap'}];
function headwearOf(p){ return p.headwear||(p.hair==='wrap'?'wrap':'none'); }
function hairOf(p){ return p.hair==='wrap'?'low':p.hair; }
function headwearHTML(i,p){ const hw=headwearOf(p); return `<div class="field"><label>Headwear</label><div class="opts">${HEADWEAR.map(h=>`<button class="opt ${hw===h.id?'picked':''}" data-act="setp" data-i="${i}" data-k="headwear" data-v="${h.id}">${h.name}</button>`).join('')}</div></div>`; }
const THUMB={r:null,scene:null,cam:null,cache:{},queue:[],busy:false,timer:0,W:60,H:76};
/* a thumbnail is stale when its option, the other choice it is drawn with, or the readiness of the assets it needs changed */
function thumbKey(look,kind,id){ const names=(typeof wardrobeNames==='function')?wardrobeNames(look):[]; const ready=names.map(n=>(WARDROBE.cache[n]?'1':WARDROBE.failed[n]?'x':'0')).join(''); const hero=(typeof HERO!=='undefined')?HERO.state:'-'; return [kind,id,look.skin,look.pi||0,kind==='hair'?look.outfit:look.hair,headwearOf(look),hero,names.join(','),ready].join('|'); }
function thumbInit(){ if(THUMB.r) return true; try{ THUMB.r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); THUMB.r.setPixelRatio(2); THUMB.r.setSize(THUMB.W,THUMB.H); THUMB.r.toneMapping=THREE.ACESFilmicToneMapping; THUMB.r.toneMappingExposure=1.1; THUMB.scene=new THREE.Scene(); THUMB.scene.add(new THREE.HemisphereLight('#FFF4E0','#6B4A3A',0.9)); const d=new THREE.DirectionalLight('#FFEBC8',1.2); d.position.set(-2,4,3); THUMB.scene.add(d); const rim=new THREE.DirectionalLight('#FFC27A',0.6); rim.position.set(3,2,-3); THUMB.scene.add(rim); THUMB.cam=new THREE.PerspectiveCamera(26,THUMB.W/THUMB.H,0.1,20); if(typeof LOOK!=='undefined'&&LOOK.pbr&&typeof makeEnv==='function'){ try{ THUMB.scene.environment=makeEnv(THUMB.r,'#BFD9F0','#F1E4CC','#8C6B4A','#FFF1D0',new THREE.Vector3(-0.5,0.8,0.7),3); }catch(e){} } return true; }catch(e){ THUMB.r=null; return false; } }
function thumbRender(look,kind){ if(!thumbInit()) return null; const g=makeAvatar(look); g.rotation.y=-0.35; THUMB.scene.add(g); if(kind==='hair'||kind==='headwear'){ THUMB.cam.position.set(0.28,1.8,1.6); THUMB.cam.lookAt(0,1.6,0); } else { THUMB.cam.position.set(0.2,1.15,4.0); THUMB.cam.lookAt(0,0.95,0); } try{ animAvatar(g,0.4,false,false,0,0.016); }catch(e){} THUMB.r.render(THUMB.scene,THUMB.cam); const url=THUMB.r.domElement.toDataURL('image/png'); THUMB.scene.remove(g); return url; }
/* queue thumbnails for every option button in the open creator panel; each one renders on its own frame */
function thumbsFor(i){ if(!S||!S.p||!S.p[i]||!document.querySelector(`.opt[data-k="hair"][data-i="${i}"]`)) return; const base=lookFor(i); const jobs=[];
  HAIRS.forEach(h=>jobs.push(['hair',h.id,Object.assign({},base,{hair:h.id})]));
  OUTFITS.forEach(o=>jobs.push(['outfit',o.id,Object.assign({},base,{outfit:o.id,oc:undefined,wear:undefined,colors:undefined,graphic:o.id==='everydaytunde'?'lagos':undefined})]));
  HEADWEAR.forEach(h=>jobs.push(['headwear',h.id,Object.assign({},base,{hair:h.id==='wrap'?'wrap':hairOf(S.p[i])})]));
  THUMB.queue=jobs.map(([kind,id,look])=>({kind,id,look,i})); if(!THUMB.busy) thumbStep(); }
function thumbsLater(i){ clearTimeout(THUMB.timer); THUMB.timer=setTimeout(()=>thumbsFor(i),350); }
function thumbStep(){ const job=THUMB.queue.shift(); if(!job){ THUMB.busy=false; return; } THUMB.busy=true;
  const btn=document.querySelector(`.opt[data-k="${job.kind}"][data-v="${job.id}"][data-i="${job.i}"]`); if(btn&&document.body.contains(btn)){ const key=thumbKey(job.look,job.kind,job.id); let url=THUMB.cache[key]; if(!url){ try{ url=thumbRender(job.look,job.kind); }catch(e){ url=null; } if(url) THUMB.cache[key]=url; } if(url){ let img=btn.querySelector('img'); if(!img){ img=document.createElement('img'); img.alt=''; btn.classList.add('thumb'); btn.insertBefore(img,btn.firstChild); } if(img.src!==url) img.src=url; } }
  requestAnimationFrame(thumbStep); }

function propMerge(root,name){ root.updateMatrixWorld(true); const groups=new Map(); root.traverse(o=>{ if(!o.isMesh||Array.isArray(o.material)) return; const g=o.geometry; if(!g.index||!g.attributes.position||!g.attributes.normal) return; const k=o.material.uuid; if(!groups.has(k)) groups.set(k,{mat:o.material,parts:[]}); groups.get(k).parts.push(o); });

/* shrink a copy uniformly so its footprint fits w x d (never enlarges); returns the scale used */

  const counter=(cw)=>{ box(cw,0.86,0.6,'#E9E2D5',0,0,0,{parent:g}); box(cw,0.04,0.62,'#CFC6B7',0,0.86,0,{parent:g}); for(let k=0;k<Math.round(cw/0.39);k++){ box(0.3,0.5,0.02,'#D9D0C0',-cw/2+0.2+k*0.39,0.2,0.31,{parent:g}); box(0.08,0.02,0.02,'#6E6A66',-cw/2+0.2+k*0.39,0.56,0.33,{parent:g}); } };

function propSofa(){ if(typeof sofa==='undefined'||!sofa||!sofa.g) return; if(!PROPS.cache.sofa_teal){ propLoad('sofa_teal',propSofa); return; } const g=sofa.g; if(g.userData.propped) return; [].concat(g.children).forEach(c=>{ if(c.isMesh) g.remove(c); }); const inst=propInstance('sofa_teal');
