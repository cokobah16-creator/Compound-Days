name: V67 relaxed Player 1 pose
on:
  pull_request:
    paths:
      - 'dist/src/pose-v67.js'
      - 'dist/index.html'
      - 'check/bench-pose-v67.cjs'
      - '.github/workflows/pose-v67.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-creator-pose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original clip and new pass syntax
        run: |
          node --check dist/src/pose-v67.js
          node --check check/bench-pose-v67.cjs
          node check/verify-shirt-v66.cjs
      - name: Test existing hero and wardrobe compatibility
        run: |
          node check/verify-hero-v61.cjs
          node check/verify-wardrobe-v52.cjs
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare V61 and V67 idle poses on mobile renderer
        run: node check/bench-pose-v67.cjs artifacts/v67-pose
      - name: Upload mobile PNGs and measured angles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compound-days-v67-relaxed-idle
          path: artifacts/v67-pose/
          if-no-files-found: warn
          retention-days: 14

  release-metadata:
    # Only update this exact review branch, after checks succeed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/v67-relaxed-player1-idle-20261112'
    needs: mobile-creator-pose
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Ensure the tested revision is the revision being stamped
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Recompute deterministic build stamp and package manifest
        run: |
          python3 tools/stamp-build.py
          python3 tools/package-manifest.py
          test -s PACKAGE_MANIFEST.json
          git diff --stat
      - name: Upload exact metadata for audit
        uses: actions/upload-artifact@v4
        with:
          name: v67-stamped-metadata
          path: |
            dist/index.html
            PACKAGE_MANIFEST.json
          retention-days: 14
      - name: Commit corrected metadata to the review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html PACKAGE_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(v67): stamp validated build and package manifest"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
